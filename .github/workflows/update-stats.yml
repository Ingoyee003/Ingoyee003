name: Update neon GitHub analytics

on:
  schedule:
    - cron: '0 */3 * * *'     # every 3 hours = "real time" without hammering the API
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'scripts/generate.mjs'

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate live neon cards
        env:
          GH_USER: Ingoyee003
          # Optional: add a repo secret named GH_STATS_TOKEN (classic PAT, scopes: read:user)
          # to also count private contributions. Falls back to the built-in token.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh live GitHub analytics"
            git push
          fi
