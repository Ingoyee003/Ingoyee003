<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="Live GitHub Analytics">
<title>Live GitHub Analytics</title>
<defs>
<filter id="glowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowL" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd"/><stop offset=".5" stop-color="#bf91f3"/><stop offset="1" stop-color="#38bdae"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70a5fd" stop-opacity=".10"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf91f3"/><stop offset="1" stop-color="#70a5fd"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdae"/><stop offset="1" stop-color="#38bdae" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes flicker{0%,19%,21%,23%,55%,57%,100%{opacity:1}20%,22%{opacity:.45}56%{opacity:.7}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hbar{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.flick{animation:flicker 6s linear infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.wave{animation:drift 7s linear infinite}
.wave2{animation:drift 11s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <path d="M6 20 L20 32 L6 44" fill="none" stroke="#38bdae" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="pulse"/>
  <text x="36" y="41" font-size="24" font-weight="800" letter-spacing="4" fill="#38bdae" filter="url(#glow)">LIVE GITHUB ANALYTICS</text>
  <rect x="36" y="52" width="403" height="2.5" rx="1.2" fill="#38bdae" filter="url(#glow)"/>
  <rect x="439" y="53" width="561" height="1" fill="url(#fade)" opacity=".7"/>
</svg>
