<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub streak: 403 contributions, current streak 0, longest streak 5">
<title>GitHub streak: 403 contributions, current streak 0, longest streak 5</title>
<defs>
<filter id="glowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowL" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd"/><stop offset=".5" stop-color="#bf91f3"/><stop offset="1" stop-color="#38bdae"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70a5fd" stop-opacity=".10"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf91f3"/><stop offset="1" stop-color="#70a5fd"/></linearGradient>
</defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes flicker{0%,19%,21%,23%,55%,57%,100%{opacity:1}20%,22%{opacity:.45}56%{opacity:.7}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hbar{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.flick{animation:flicker 6s linear infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.wave{animation:drift 7s linear infinite}
.wave2{animation:drift 11s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect width="495" height="195" rx="14" fill="#1a1b27"/>
<rect x="1" y="1" width="493" height="193" rx="13" fill="url(#sheen)"/>
<rect x="1" y="1" width="493" height="193" rx="13" fill="none" stroke="url(#neon)" stroke-width="1.6" filter="url(#glowS)"/>
  <rect x="14" y="14" width="32" height="32" rx="8" fill="#0b0c14" stroke="#70a5fd" stroke-opacity=".45"/>
  <text x="30" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#bf91f3" filter="url(#glowS)">&lt;/&gt;</text>
  
<g transform="translate(423 21)">
  <circle cx="6" cy="6" r="3.5" fill="#38bdae" class="pulse" filter="url(#glow)"/>
  <text x="16" y="10" font-size="10" letter-spacing="1.6" fill="#38bdae" class="pulse">LIVE</text>
</g>
  <line x1="165" y1="56" x2="165" y2="160" stroke="#7982a9" stroke-opacity=".6"/>
  <line x1="330" y1="56" x2="330" y2="160" stroke="#7982a9" stroke-opacity=".6"/>
  
  <text x="82" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#70a5fd" filter="url(#glow)">403</text>
  <text x="82" y="126" text-anchor="middle" font-size="13" fill="#70a5fd" filter="url(#glowS)">Total Contributions</text>
  <text x="82" y="150" text-anchor="middle" font-size="9.5" fill="#38bdae">Jun 24, 2023 - Present</text>
  
  <text x="412" y="98" text-anchor="middle" font-size="30" font-weight="700" fill="#70a5fd" filter="url(#glow)">5</text>
  <text x="412" y="126" text-anchor="middle" font-size="13" fill="#70a5fd" filter="url(#glowS)">Longest Streak</text>
  <text x="412" y="150" text-anchor="middle" font-size="9.5" fill="#38bdae">Jul 17, 2023 - Jul 21, 2023</text>

  <circle cx="247.5" cy="86" r="36" fill="none" stroke="#70a5fd" stroke-width="5" stroke-linecap="round"
    stroke-dasharray="199.1 27.1" transform="rotate(-68.4 247.5 86)" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values=".7;1;.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#fff" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M283.5,86 A36,36 0 1,1 211.5,86 A36,36 0 1,1 283.5,86"/>
  </circle>
  <g transform="translate(247.5 50) scale(1.15)" filter="url(#glow)" class="flick">
    <path d="M0 -11 C3 -6 9 -3 9 3 C9 8 5 11 0 11 C-5 11 -9 8 -9 3 C-9 -1 -6 -3 -4 -7 C-3 -4 -2 -3 0 -2 C1 -5 1 -8 0 -11 Z"
      fill="#bf91f3" fill-opacity=".25" stroke="#bf91f3" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <text x="247.5" y="97" text-anchor="middle" font-size="30" font-weight="700" fill="#bf91f3" filter="url(#glow)">0</text>
  <text x="247.5" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#bf91f3" filter="url(#glowS)">Current Streak</text>
  <text x="247.5" y="168" text-anchor="middle" font-size="11" fill="#38bdae">Nov 16</text>
</svg>
