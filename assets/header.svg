<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="MAHMUDA ISLAM RIFAH - Game Developer, Software Engineer, SQA Engineer">
<title>MAHMUDA ISLAM RIFAH - Game Developer, Software Engineer, SQA Engineer</title>
<defs>
<filter id="glowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowL" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70a5fd"/><stop offset=".5" stop-color="#bf91f3"/><stop offset="1" stop-color="#38bdae"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#70a5fd" stop-opacity=".10"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf91f3"/><stop offset="1" stop-color="#70a5fd"/></linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#70a5fd" stroke-opacity=".10"/></pattern>
  <radialGradient id="gB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#70a5fd" stop-opacity=".30"/><stop offset="1" stop-color="#70a5fd" stop-opacity="0"/></radialGradient>
  <radialGradient id="gP" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bf91f3" stop-opacity=".28"/><stop offset="1" stop-color="#bf91f3" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes flicker{0%,19%,21%,23%,55%,57%,100%{opacity:1}20%,22%{opacity:.45}56%{opacity:.7}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hbar{transform-box:fill-box;transform-origin:0 50%;animation:growX 1.1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.flick{animation:flicker 6s linear infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.wave{animation:drift 7s linear infinite}
.wave2{animation:drift 11s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <rect width="1000" height="290" fill="#0b0c14"/>
  <rect width="1000" height="290" fill="url(#grid)"/>
  <ellipse cx="170" cy="70" rx="360" ry="150" fill="url(#gB)"/>
  <ellipse cx="860" cy="250" rx="360" ry="150" fill="url(#gP)"/>
  <rect y="-40" width="1000" height="40" fill="url(#scan)"><animate attributeName="y" from="-40" to="290" dur="6s" repeatCount="indefinite"/></rect>
  <rect width="1000" height="3" fill="url(#neon)" filter="url(#glow)"/>
  <rect y="287" width="1000" height="3" fill="url(#neon)" filter="url(#glow)"/>
  <path d="M26 26 H70 M26 26 V70" stroke="#22d3ee" stroke-width="2" fill="none" filter="url(#glowS)"/>
  <path d="M974 264 H930 M974 264 V220" stroke="#fb7185" stroke-width="2" fill="none" filter="url(#glowS)"/>
  <text x="500" y="70" text-anchor="middle" font-size="13" letter-spacing="7" fill="#38bdae" class="pulse">// PORTFOLIO.EXE · ONLINE</text>
  <g class="flick">
    <text x="500" y="145" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="3" fill="url(#neon)" filter="url(#glowL)">MAHMUDA ISLAM RIFAH</text>
    <text x="500" y="145" text-anchor="middle" font-size="52" font-weight="800" letter-spacing="3" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".8">MAHMUDA ISLAM RIFAH</text>
  </g>
  <rect x="300" y="165" width="400" height="2" rx="1" fill="url(#neon)" filter="url(#glow)"/>
  <text x="500" y="203" text-anchor="middle" font-size="19" font-weight="700" filter="url(#glowS)"><tspan fill="#fb7185">Game Developer</tspan><tspan fill="#7982a9"> | </tspan><tspan fill="#70a5fd">Software Engineer (Web &amp; App)</tspan><tspan fill="#7982a9"> | </tspan><tspan fill="#22d3ee">SQA Engineer</tspan></text>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.30;.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    <text x="500" y="244" text-anchor="middle" font-size="15"><tspan fill="#fb7185">~/rifah $ </tspan><tspan fill="#70a5fd">Unity (C#) games, Godot &amp; a custom Java render engine</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.30;.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    <text x="500" y="244" text-anchor="middle" font-size="15"><tspan fill="#fb7185">~/rifah $ </tspan><tspan fill="#70a5fd">React, Next.js, Kotlin &amp; Flutter products</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.30;.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    <text x="500" y="244" text-anchor="middle" font-size="15"><tspan fill="#fb7185">~/rifah $ </tspan><tspan fill="#70a5fd">Selenium, Playwright, Appium &amp; Newman CI/CD</tspan></text>
  </g>
</svg>
